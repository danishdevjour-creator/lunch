<!doctype html>
<html lang="en" data-title-key="brand.tagline">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lunch Budget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="i18n.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="#" id="logo-link">
        <span class="logo-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 11h18a9 9 0 0 1-18 0Z"/><path d="M8 7c0-1.5 1-1.5 1-3"/><path d="M12 7c0-1.5 1-1.5 1-3"/><path d="M16 7c0-1.5 1-1.5 1-3"/>
          </svg>
        </span>
        <span class="logo-text"><span id="brand-name">Lunch Budget</span><small data-i18n="brand.tagline">Lunch budget</small></span>
      </a>

      <nav class="menu hidden" id="menu">
        <button class="nav-btn active" data-page="overview" data-i18n="nav.overview">Overview</button>
        <button class="nav-btn" data-page="members" data-i18n="nav.members">Members</button>
        <button class="nav-btn" data-page="lunch" data-i18n="nav.lunch">Record lunch</button>
        <button class="nav-btn" data-page="payments"><span data-i18n="nav.payments">Payments</span><span class="pill hidden" id="pending-pill"></span></button>
        <button class="nav-btn" data-page="emails" data-i18n="nav.emails">Email log</button>
        <button class="nav-btn" data-page="settings" data-i18n="nav.settings">Settings</button>
      </nav>

      <div class="tools">
        <label class="lang-select" style="margin:0">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 0 20a15 15 0 0 1 0-20"/>
          </svg>
          <select id="lang" data-i18n-aria="lang.label">
            <option value="en">English</option>
            <option value="ur">اردو</option>
          </select>
        </label>
        <button class="icon-btn" id="theme-toggle" type="button" data-i18n-aria="theme.toggle">
          <svg class="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          <svg class="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="btn pill-btn" id="auth-btn" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg>
          <span class="auth-label" id="auth-label">Login</span>
        </button>
        <button class="icon-btn menu-toggle hidden" id="menu-toggle" type="button" data-i18n-aria="menu.toggle" aria-expanded="false" aria-controls="menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Login -->
    <div id="login" class="login-wrap hidden">
      <form class="card login-card" id="login-form">
        <span class="logo-mark" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 11h18a9 9 0 0 1-18 0Z"/><path d="M8 7c0-1.5 1-1.5 1-3"/><path d="M12 7c0-1.5 1-1.5 1-3"/><path d="M16 7c0-1.5 1-1.5 1-3"/>
          </svg>
        </span>
        <h2 style="margin-bottom:4px" data-i18n="login.title">Welcome back</h2>
        <p class="muted" style="margin-top:0" data-i18n="login.subtitle"></p>
        <div class="field">
          <label for="password" data-i18n="login.password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn" style="width:100%" data-i18n="login.submit">Login</button>
      </form>
    </div>

    <div id="app" class="hidden">
      <!-- Overview -->
      <section data-section="overview">
        <div class="page-head"><h1 data-i18n="overview.title">Overview</h1></div>
        <div id="config-notice"></div>
        <div class="grid stats">
          <div class="card stat hero"><div class="label" data-i18n="stat.balance"></div><div class="value" id="s-balance">–</div></div>
          <div class="card stat"><div class="label" data-i18n="stat.collected"></div><div class="value" id="s-collected">–</div></div>
          <div class="card stat"><div class="label" data-i18n="stat.spent"></div><div class="value" id="s-spent">–</div></div>
          <div class="card stat"><div class="label" data-i18n="stat.members"></div><div class="value" id="s-members">–</div></div>
          <div class="card stat"><div class="label" data-i18n="stat.pending"></div><div class="value" id="s-pending">–</div></div>
        </div>
        <div class="grid two-col">
          <div class="card">
            <h3 data-i18n="overview.alerts"></h3>
            <div class="table-wrap"><table>
              <thead><tr><th data-i18n="col.member"></th><th class="num" data-i18n="col.balance"></th><th></th></tr></thead>
              <tbody id="alerts-body"></tbody>
            </table></div>
          </div>
          <div class="card">
            <div class="toolbar" style="justify-content:space-between;margin-bottom:12px">
              <h3 style="margin:0" data-i18n="overview.chart"></h3>
              <div class="legend"><span class="in" data-i18n="legend.collected"></span><span class="out" data-i18n="legend.spent"></span></div>
            </div>
            <div class="bars" id="chart"></div>
          </div>
        </div>
        <div class="card" style="margin-top:16px">
          <h3 data-i18n="overview.recent"></h3>
          <div class="table-wrap"><table>
            <thead><tr><th data-i18n="col.date"></th><th data-i18n="col.member"></th><th data-i18n="col.type"></th><th data-i18n="col.method"></th><th class="num" data-i18n="col.amount"></th><th data-i18n="col.status"></th></tr></thead>
            <tbody id="recent-body"></tbody>
          </table></div>
        </div>
      </section>

      <!-- Members -->
      <section data-section="members" class="hidden">
        <div class="page-head">
          <h1 data-i18n="members.title"></h1>
          <div class="toolbar">
            <input id="member-search" data-i18n-placeholder="members.search">
            <label class="check-item" style="padding:7px 10px"><input type="checkbox" id="show-inactive"> <span data-i18n="members.inactive"></span></label>
            <button class="btn" id="add-member-btn" data-i18n="members.add"></button>
          </div>
        </div>
        <div class="card">
          <div class="table-wrap"><table>
            <thead><tr>
              <th data-i18n="col.name"></th><th data-i18n="col.email"></th><th data-i18n="col.phone"></th>
              <th class="num" data-i18n="col.deposited"></th><th class="num" data-i18n="col.spent"></th><th class="num" data-i18n="col.remaining"></th><th data-i18n="col.status"></th><th></th>
            </tr></thead>
            <tbody id="members-body"></tbody>
          </table></div>
        </div>
      </section>

      <!-- Record lunch -->
      <section data-section="lunch" class="hidden">
        <div class="page-head"><h1 data-i18n="lunch.title"></h1></div>
        <div class="grid two-col">
          <form class="card" id="lunch-form">
            <h3 data-i18n="lunch.details"></h3>
            <div class="form-grid">
              <div class="field"><label data-i18n="field.date"></label><input type="date" name="date" required></div>
              <div class="field"><label data-i18n="field.description"></label><input name="description" data-i18n-placeholder="lunch.descPlaceholder"></div>
              <div class="field">
                <label data-i18n="lunch.chargeAs"></label>
                <select name="mode">
                  <option value="per_person" data-i18n="lunch.perPerson"></option>
                  <option value="total" data-i18n="lunch.split"></option>
                </select>
              </div>
              <div class="field"><label id="amount-label"></label><input type="number" name="amount" min="1" step="any" required></div>
            </div>
            <div class="toolbar" style="justify-content:space-between;margin:6px 0 10px">
              <label style="margin:0"><span data-i18n="lunch.who"></span> <span id="selected-count" class="muted"></span></label>
              <div class="actions">
                <button type="button" class="btn sm secondary" id="select-all" data-i18n="btn.selectAll"></button>
                <button type="button" class="btn sm secondary" id="select-none" data-i18n="btn.clear"></button>
              </div>
            </div>
            <div class="checklist" id="lunch-members"></div>
            <p class="muted" id="lunch-preview"></p>
            <button class="btn" data-i18n="lunch.save"></button>
          </form>
          <div class="card">
            <h3 data-i18n="lunch.previous"></h3>
            <div class="table-wrap"><table>
              <thead><tr><th data-i18n="col.date"></th><th data-i18n="col.description"></th><th class="num" data-i18n="col.people"></th><th class="num" data-i18n="col.each"></th><th class="num" data-i18n="col.total"></th><th></th></tr></thead>
              <tbody id="lunches-body"></tbody>
            </table></div>
          </div>
        </div>
      </section>

      <!-- Payments -->
      <section data-section="payments" class="hidden">
        <div class="page-head">
          <h1 data-i18n="payments.title"></h1>
          <div class="toolbar">
            <select id="tx-filter">
              <option value="pending" data-i18n="filter.pending"></option>
              <option value="" data-i18n="filter.all"></option>
              <option value="deposit" data-i18n="filter.deposits"></option>
              <option value="expense" data-i18n="filter.expenses"></option>
            </select>
            <button class="btn" id="add-tx-btn" data-i18n="payments.record"></button>
          </div>
        </div>
        <div class="card">
          <div class="table-wrap"><table>
            <thead><tr><th data-i18n="col.date"></th><th data-i18n="col.member"></th><th data-i18n="col.type"></th><th data-i18n="col.method"></th><th data-i18n="col.reference"></th><th class="num" data-i18n="col.amount"></th><th data-i18n="col.status"></th><th></th></tr></thead>
            <tbody id="tx-body"></tbody>
          </table></div>
        </div>
      </section>

      <!-- Emails -->
      <section data-section="emails" class="hidden">
        <div class="page-head"><h1 data-i18n="emails.title"></h1></div>
        <div class="card">
          <div class="table-wrap"><table>
            <thead><tr><th data-i18n="col.date"></th><th data-i18n="col.member"></th><th data-i18n="col.to"></th><th data-i18n="col.subject"></th><th data-i18n="col.status"></th></tr></thead>
            <tbody id="emails-body"></tbody>
          </table></div>
        </div>
      </section>

      <!-- Settings -->
      <section data-section="settings" class="hidden">
        <div class="page-head"><h1 data-i18n="settings.title"></h1></div>
        <form id="settings-form" class="grid two-col">
          <div class="card">
            <h3 data-i18n="settings.general"></h3>
            <div class="field"><label data-i18n="field.company"></label><input name="company_name"></div>
            <div class="form-grid">
              <div class="field"><label data-i18n="field.currency"></label><input name="currency"></div>
              <div class="field"><label data-i18n="field.defaultLunch"></label><input name="default_lunch_cost" type="number" step="any"></div>
            </div>
            <div class="field">
              <label data-i18n="field.lowAlert"></label>
              <input name="low_balance_threshold" type="number" step="any">
              <p class="muted" style="margin:4px 0 0" data-i18n="settings.lowHelp"></p>
            </div>
          </div>
          <div class="card">
            <h3 data-i18n="settings.jazzcash"></h3>
            <div class="form-grid">
              <div class="field"><label data-i18n="field.jazzNumber"></label><input name="jazzcash_number" placeholder="03XX-XXXXXXX" dir="ltr"></div>
              <div class="field"><label data-i18n="field.accountTitle"></label><input name="jazzcash_title"></div>
            </div>
            <h3 style="margin-top:8px" data-i18n="settings.meezan"></h3>
            <div class="form-grid">
              <div class="field"><label data-i18n="field.accountTitle"></label><input name="meezan_account_title"></div>
              <div class="field"><label data-i18n="field.accountNumber"></label><input name="meezan_account_number" dir="ltr"></div>
              <div class="field"><label data-i18n="field.iban"></label><input name="meezan_iban" placeholder="PK..MEZN...." dir="ltr"></div>
              <div class="field"><label data-i18n="field.branch"></label><input name="meezan_branch"></div>
            </div>
            <p class="muted" id="gateway-status"></p>
          </div>
          <div><button class="btn" data-i18n="settings.save"></button></div>
        </form>
      </section>
    </div>
  </main>

  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
