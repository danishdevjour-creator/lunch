<!doctype html>
<html lang="en" data-title-key="pay.pageTitle">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Lunch Money</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="i18n.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner simple">
      <span class="logo">
        <span class="logo-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 11h18a9 9 0 0 1-18 0Z"/><path d="M8 7c0-1.5 1-1.5 1-3"/><path d="M12 7c0-1.5 1-1.5 1-3"/><path d="M16 7c0-1.5 1-1.5 1-3"/>
          </svg>
        </span>
        <span class="logo-text"><span id="brand-name">Lunch Budget</span><small data-i18n="brand.tagline">Lunch budget</small></span>
      </span>
      <div class="tools">
        <label class="lang-select" style="margin:0">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 0 20a15 15 0 0 1 0-20"/>
          </svg>
          <select id="lang" data-i18n-aria="lang.label">
            <option value="en">English</option>
            <option value="ur">اردو</option>
          </select>
        </label>
        <button class="icon-btn" id="theme-toggle" type="button" data-i18n-aria="theme.toggle">
          <svg class="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          <svg class="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="pay-wrap">
    <div id="error" class="notice err hidden"></div>
    <div id="result" class="notice hidden"></div>

    <div id="content" class="hidden">
      <div class="card balance-hero">
        <div class="muted" id="company"></div>
        <h2 id="member-name" style="margin-top:6px"></h2>
        <div class="value" id="balance"></div>
        <div class="muted" id="balance-detail"></div>
      </div>

      <div class="card" style="margin-top:16px">
        <h3 data-i18n="pay.addMoney"></h3>
        <div class="method-tabs">
          <button class="method-tab active" data-method="jazzcash"><span data-i18n="method.jazzcash"></span><small data-i18n="pay.wallet"></small></button>
          <button class="method-tab" data-method="meezan"><span data-i18n="method.meezan"></span><small data-i18n="pay.bank"></small></button>
        </div>

        <div class="field">
          <label for="amount" data-i18n="field.amount"></label>
          <input id="amount" type="number" min="1" step="any" data-i18n-placeholder="pay.amountPh">
          <div class="quick-amounts">
            <button type="button" class="btn sm secondary" data-amt="1000">1,000</button>
            <button type="button" class="btn sm secondary" data-amt="2000">2,000</button>
            <button type="button" class="btn sm secondary" data-amt="3000">3,000</button>
            <button type="button" class="btn sm secondary" data-amt="5000">5,000</button>
          </div>
        </div>

        <div id="online-box">
          <button class="btn" id="pay-online" style="width:100%"></button>
          <div class="divider" data-i18n="pay.orManual"></div>
        </div>

        <div id="manual-box">
          <div class="account-box" id="account-details"></div>
          <div class="field">
            <label for="reference" id="reference-label"></label>
            <input id="reference" dir="ltr" data-i18n-placeholder="pay.refPh">
          </div>
          <button class="btn secondary" id="submit-manual" style="width:100%" data-i18n="pay.sent"></button>
          <p class="muted" style="font-size:12px" data-i18n="pay.note"></p>
        </div>
      </div>

      <div class="card" style="margin-top:16px">
        <h3 data-i18n="pay.history"></h3>
        <div class="table-wrap"><table><tbody id="history"></tbody></table></div>
      </div>
    </div>
  </div>
  <form id="gateway-form" method="POST" class="hidden"></form>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="pay.js"></script>
</body>
</html>
